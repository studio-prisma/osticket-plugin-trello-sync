name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.0). Must already exist.'
        required: true
        type: string

permissions:
  contents: write
  id-token: write       # build-provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$GITHUB_REF_NAME"
          fi
          # Later steps put the tag into shell code; only a plain release tag
          # may get that far. [[ =~ ]] tests the whole string, grep would not.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::not a release tag (vX.Y.Z or vX.Y.Z-rc.N): $TAG"
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      # Version-Gate: die Version steht an genau einer Stelle (plugin.php).
      # Laufen Tag und Manifest auseinander, bricht der Release ab.
      - name: Verify plugin.php version matches the tag
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          MANIFEST=$(grep -oP "'version'\s*=>\s*'\K[^']+" plugin.php)
          if [ "$MANIFEST" != "$VERSION" ]; then
            echo "::error::plugin.php declares '$MANIFEST' but the tag is '$VERSION'."
            exit 1
          fi
          echo "Version $VERSION confirmed."

      - name: Build install package
        id: build
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          # bash explicitly: a tag cut while the script lacked its executable
          # bit (v0.6.0) must still build.
          bash ./tools/build-zip.sh "$VERSION"
          echo "asset=dist/trello-sync-${VERSION}.zip" >> "$GITHUB_OUTPUT"


      # Signed statement that this file was built by this workflow from this
      # commit. Check a downloaded package with:
      #   gh attestation verify <file> --repo ${{ github.repository }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.build.outputs.asset }}
      - name: Extract CHANGELOG section for this version
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          # Pull lines from "## [VERSION]" up to (but not including) the next "## [" header.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\["v"\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG section found for $TAG — release will use a fallback note."
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo 'notes<<RELEASE_NOTES_EOF'
            echo "$NOTES"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.changelog.outputs.notes }}
          files: ${{ steps.build.outputs.asset }}
          draft: false
          prerelease: false
