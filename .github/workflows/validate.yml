name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Monday 06:00 UTC — catches PHP release drift and Trello API changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PHP Lint (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl
          coverage: none

      - name: Syntax check all production files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" || fail=1
          done < <(find . -name '*.php' -not -path './tests/*' -print0)
          exit $fail

  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl
          coverage: none

      # error_reporting=E_ALL, damit Deprecations die Suite rot machen statt
      # unbemerkt durchzulaufen. Jede Datei hat exit 0 = gruen, 1 = rot.
      - name: Unit tests
        run: |
          fail=0
          for t in tests/test_signature.php tests/test_board.php tests/test_rules.php tests/test_headers.php \
                   tests/test_mapping_binding.php tests/test_log_throttle.php; do
            echo "::group::$t"
            php -d error_reporting=E_ALL "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  structure:
    name: Structure check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # Struktureller Integritaetscheck gegen stille Truncation. Ersetzt kein
      # php -l, faengt aber abgeschnittene Dateien, die syntaktisch gueltig sind.
      # ./ vor dem Glob, sonst koennte ein Dateiname mit fuehrendem Bindestrich
      # als Option gelesen werden (shellcheck SC2035).
      - name: Structural integrity
        run: python3 tools/verify_structure.py ./*.php ./tests/*.php

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: actionlint
        uses: raven-actions/actionlint@v2

  # Zentraler Security-Scan: gitleaks, TruffleHog, Trivy, Semgrep (alle blockierend).
  # Semgrep blockiert nur neue Funde. Version: Commit des Release-Tags, siehe Kommentar.
  security:
    uses: studio-prisma/github-config-security-workflow/.github/workflows/security.yml@510cea39c4ecb83fb25fdfca88649dc014eae883 # v1.1.0
    with:
      semgrep-rules: "p/php p/security-audit"
    secrets:
      identity-pattern: ${{ secrets.IDENTITY_PATTERN }}

  # Single aggregating context for the branch ruleset. Required-status-check names
  # are job names, and the lint matrix produces one name per PHP version — those
  # would have to be re-registered on every version bump. This job is the only
  # context the ruleset knows about; the matrix can change freely underneath it.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [lint, unit, structure, security, actionlint]
    if: always()
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "lint=${{ needs.lint.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "structure=${{ needs.structure.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          exit 1
